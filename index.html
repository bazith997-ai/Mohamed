<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Megha ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff7eb3,#ffb6d9);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.page{
display:none;
text-align:center;
background:white;
padding:30px;
border-radius:20px;
width:90%;
max-width:420px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.active{
display:block;
}

h1{
color:#ff2d75;
margin-bottom:15px;
}

p{
font-size:20px;
margin-bottom:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:8px;
}

.yes{
background:#ff2d75;
color:white;
}

.no{
background:#666;
color:white;
position:absolute;
}

input{
padding:10px;
width:90%;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.heart{
position:fixed;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}
</style>
</head>

<body>

<div id="p1" class="page active">
<h1>Hi Megha ❤️</h1>
<p><b>Will you be my forever?</b></p>

<button class="yes" onclick="next(2)">Yes ❤️</button>
<button id="noBtn" class="no">No 😅</button>
</div>

<div id="p2" class="page">
<h1>Yay!! ❤️</h1>
<p>When are you free?</p>

<input type="date" id="date"><br>
<input type="time" id="time"><br>

<button class="yes" onclick="saveDate()">Set the Date ❤️</button>
</div>

<div id="p3" class="page">
<h1>💘</h1>

<p id="showDate"></p>

<p>Be ready by the date, chelloo 💘</p>

<button class="yes" onclick="next(4)">Accept ❤️</button>
</div>

<div id="p4" class="page">
<h1>😂 One Last Thing</h1>

<p>You have to pay <b>₹100</b> for fuel ⛽</p>

<button class="yes" onclick="finish()">Pay & Confirm 💖</button>
</div>

<div id="p5" class="page">

<h1>😂 Just Kidding!</h1>

<p>
Your smile is enough ❤️<br><br>
I can't wait to see you.<br><br>
Love you Megha 💖
</p>

<h2>— Bazith ❤️</h2>

</div>

<script>

const no=document.getElementById("noBtn");

no.addEventListener("mouseover",()=>{
let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);
no.style.left=x+"px";
no.style.top=y+"px";
});

function next(n){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById("p"+n).classList.add("active");
}

function saveDate(){

let d=document.getElementById("date").value;
let t=document.getElementById("time").value;

if(d==""||t==""){
alert("Choose date & time ❤️");
return;
}

document.getElementById("showDate").innerHTML=
"📅 "+d+"<br>🕒 "+t;

next(3);

}

function finish(){
next(5);
confetti();
}

function confetti(){

for(let i=0;i<80;i++){

let h=document.createElement("div");

h.innerHTML="💖";
h.className="heart";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(h);

setTimeout(()=>h.remove(),6000);

}

}

</script>

</body>
</html>
